<footer>
  <div class="container footer-inner">
    <nav aria-label="Footer links">
      <ul class="footer-links">
        <li><a href="mailto:{{ site.social-network-links.email }}">Email</a></li>
        <li><a href="https://linkedin.com/in/{{ site.social-network-links.linkedin }}">LinkedIn</a></li>
        <li><a href="https://github.com/{{ site.social-network-links.github }}">GitHub</a></li>
        {% if site.posts.size > 0 %}<li><a href="{{ '/feed.xml' | relative_url }}">RSS</a></li>{% endif %}
      </ul>
    </nav>
    <p class="copyright">&copy; {{ site.time | date: '%Y' }} {{ site.author.name }}</p>
  </div>
</footer>
